# fullsend per-repo configuration
# https://github.com/fullsend-ai/fullsend
#
# This file configures fullsend for per-repo installation mode.
# See ADR 0033 for details.
version: "1"
runtime: dummy
roles:
    - triage
    - coder
    - review
    - fix
    - retro
    - prioritize
agents:
    - name: review-ping
      source: harness/review-ping.yaml
    - name: enabled-ping
      source: harness/enabled-ping.yaml
    - name: disabled-ping
      source: harness/disabled-ping.yaml
      enabled: false
    - name: fork-pr-ping
      source: harness/fork-pr-ping.yaml
    - name: fork-issue-ping
      source: harness/fork-issue-ping.yaml
    - name: local-ping
      source: harness/local-ping.yaml
    - name: url-mixed
      source: https://raw.githubusercontent.com/halfsend-06/test-repo-04-url-harness-host/main/harness/url-mixed.yaml#sha256=74ec8c7134bd54f52b8ad4454eba8ac6762dc7629634515179ade6a938acdf03
    - name: pr-ping
      source: harness/pr-ping.yaml
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
    - https://raw.githubusercontent.com/halfsend-06/test-repo-04-url-harness-host/
create_issues:
    allow_targets:
        repos:
            - halfsend-06/test-repo-04
            - fullsend-ai/fullsend
